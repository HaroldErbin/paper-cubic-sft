# Reused blocks of the complete write-up, in chapter order.
# Specification: agent/task-plans/dist-writeup-2026-11-07.md, Part 2 (table of
# contents) and Part 3 (assembly recipe).  Read by tools/extract.py, which
# accepts only the YAML subset used here: top-level keys holding lists of flat
# mappings; scalar values plain or single-quoted (no escapes, '' is a quote).
#
# documents: one entry per source tag, the files whose \label definitions make
#   up that source document (a reference is prefixed only when its label is
#   defined in the same document).  rev: a git revision, or 'worktree'.
#   path: a file, or a directory (all .tex files below it).
# chapters: number, slug (sections/<number>-<slug>.tex), title, appendix.
# blocks: chapter, order (k), source (path from the project root), rev, tag,
#   and one range:
#     whole: 'yes'                  the whole file;
#     lines: 'a-b'                  lines a to b, both included (1-based);
#     heading: '<text>'             from the heading line containing <text>
#                                   (optionally level: section, subsection,
#                                   subsubsection, paragraph) to the line
#                                   before the next heading of the same or a
#                                   higher level, \appendix,
#                                   \printbibliography or \end{document};
#     heading + to: '<text>'        from the heading to the line before the
#                                   first later line containing <text>.

